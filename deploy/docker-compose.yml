# gohome bot + MCP，前置 mcp-auth-proxy（对 claude.ai 网页版提供 OAuth）
# 用法见 deploy/README.md「方式 A：Docker Compose」。
# 在 deploy/ 目录执行：docker compose up -d --build

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]   # AOF：每次写都落盘，重启不丢注册群
    volumes:
      - ./data/redis:/data     # 映射到本地目录，可直接查看/备份

  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ./bot.env            # TOKEN / MCP_TARGET_CHAT_ID / MCP_JWT_SECRET
    environment:
      # docker 内网寻址与监听（这几项由 compose 固定，勿在 bot.env 里改）
      TZ: Asia/Shanghai       # 日志用北京时间；main.go 内嵌 tzdata，distroless 里也生效
      RDB_URL: redis://redis:6379
      MCP_ADDR: 0.0.0.0:8081  # 仅 docker 内网可达，不 publish 到宿主 = 等价回环
    volumes:
      - ./logs:/app/logs       # bot 日志（lumberjack 滚动文件）落到本地
    # 仅当用 TTS http provider（本地 worker + ssh -R 隧道）时取消注释：让容器经宿主网关
    # 访问隧道（配合本地 ssh -R 0.0.0.0:5000 + VPS sshd GatewayPorts；bot.env 里
    # TTS_HTTP_URL=http://host.docker.internal:5000/tts）。详见 deploy/tts-worker/README.md
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    # 注意：不要给 bot 加 ports，8081 只暴露给 proxy，不对宿主/公网开放

  mcp-proxy:
    image: ghcr.io/sigbit/mcp-auth-proxy:latest
    restart: unless-stopped
    env_file:
      - ./proxy.env          # EXTERNAL_URL / GOOGLE_* / PROXY_BEARER_TOKEN
    environment:
      DATA_PATH: /data       # 覆盖 proxy.env，落到下面的 volume
    # 上游填 bot 的根地址（不带 /mcp）：代理会把外部请求路径 /mcp 拼到上游后，
    # 得到 http://bot:8081/mcp；若上游写成 .../mcp 会变成 /mcp/mcp → 404
    command: ["--", "http://bot:8081"]
    ports:
      - "80:80"              # ACME HTTP-01 验证
      - "443:443"            # 对外 HTTPS
    volumes:
      - proxy-data:/data
    depends_on:
      - bot

volumes:
  proxy-data:
