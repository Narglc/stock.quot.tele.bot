# Docker Caddy 版：Caddy 也作为容器，独占 80/443，统一 ACME。
# mcp-proxy 不对外暴露端口，只在 docker 内网被 caddy 反代。
# 用法：docker compose -f docker-compose.docker-caddy.yml up -d --build
# 注意：proxy.env 的 TRUSTED_PROXIES 改成私网段 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis-data:/data]

  bot:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: [./bot.env]
    environment:
      RDB_URL: redis://redis:6379
      MCP_ADDR: 0.0.0.0:8081
    depends_on: [redis]

  mcp-proxy:
    image: ghcr.io/sigbit/mcp-auth-proxy:latest
    restart: unless-stopped
    env_file: [./proxy.env]
    environment:
      DATA_PATH: /data
      TRUSTED_PROXIES: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"  # 覆盖成 docker 私网段
    command: ["--", "http://bot:8081"]
    volumes: [proxy-data:/data]
    depends_on: [bot]
    # 无 ports：仅内网，由 caddy 反代

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/usr/share/nginx/html:ro   # 静态网页
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    depends_on: [mcp-proxy]

volumes:
  redis-data:
  proxy-data:
  caddy-data:
  caddy-config:
  caddy-logs:
