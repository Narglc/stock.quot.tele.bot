# 宿主 Caddy 站点片段：放到 /etc/caddy/sites/narglc.eu.org.conf
# 需在 /etc/caddy/Caddyfile 里有 `import sites/*.conf`。
# 配合 docker-compose.host-caddy.yml（mcp-proxy 在 127.0.0.1:8080）。

narglc.eu.org {
    # 访问日志（log 是站点级指令，必须放顶层，不能进 handle 块）
    log {
        output file /var/log/caddy/narglc.eu.org/access.log
        # Caddy 默认已滚动(100MiB/keep10/2160h)；要自定义就用 output file <path> { roll_size ... }
    }

    # MCP 代理独占的路径 → 转宿主上的 mcp-proxy
    @mcp path /mcp /mcp/* /.well-known/* /.idp/* /.auth/* /healthz
    handle @mcp {
        reverse_proxy 127.0.0.1:8080
    }

    # 其余路径 = 静态网页
    handle {
        root * /usr/share/nginx/html   # 换成你的静态站目录
        encode gzip
        file_server
    }
}
