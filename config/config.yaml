telegram:
  token: ""            # 留空，用 TOKEN 环境变量覆盖
redis:
  url: ""              # 留空，用 RDB_URL 环境变量覆盖
mcp:
  addr: "127.0.0.1:8081"
  target_chat_id: 0    # 设为自己的 chat_id 才启用 MCP（0=不启用）；也是无鉴权时的默认发送目标
  jwt_secret: ""       # 留空=不鉴权（仅回环用）；非空则要求 JWT Bearer，用 MCP_JWT_SECRET 覆盖
tts:
  provider: ""         # 留空=不启用语音；"azure" / "edge"，用 TTS_PROVIDER 覆盖
  azure:
    key: ""            # 留空，用 AZURE_TTS_KEY 覆盖（勿入库）
    region: ""         # 如 eastasia / eastus，用 AZURE_TTS_REGION 覆盖
    voice: "zh-CN-XiaoxiaoNeural"   # 中文女声；可换 zh-CN-YunxiNeural 等
  edge:
    voice: "zh-CN-XiaoxiaoNeural"   # edge-tts 备选（需服务器装 edge-tts）
  http:                             # 委托外部 HTTP TTS（本地 worker 经 ssh -R 映射到回环）
    url: ""                         # TTS_HTTP_URL，如 http://127.0.0.1:5000/tts
    voice: ""                       # TTS_HTTP_VOICE，转发给 worker（可空，用 worker 默认）
    token: ""                       # TTS_HTTP_TOKEN，与 worker 约定的共享密钥（可空）
apify:
  token: ""                         # APIFY_TOKEN，清算图(/liqmap)数据源，留空则 /liqmap 不可用
image:                              # /gen 生图 worker（本地 GPU，经 Tailscale/隧道暴露）
  url: ""                           # IMAGE_URL，如 http://100.x.x.x:5001/gen；留空则 /gen 不可用
  token: ""                         # IMAGE_TOKEN，与 worker 约定的共享密钥（可空）
liqweb:                             # 清算热力图网页（Cloudflare Worker），留空则不推送快照
  url: ""                           # LIQWEB_URL，如 https://liqmap.example.workers.dev
  token: ""                         # LIQWEB_TOKEN，与 Worker 的 PUSH_TOKEN secret 一致
logger:
  level: "debug"
  logPath: "logs/tele.bog.log"
  maxSize: 500
  maxBackups: 15
  maxAge: 28
  commpress: true
